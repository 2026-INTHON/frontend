name: Frontend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build:web
        env:
          EXPO_PUBLIC_API_URL: https://inthon-demo-20261031-dh.koreacentral.cloudapp.azure.com
      - name: Build and check the restricted VM image
        run: |
          docker build -t malo-frontend:ci .
          docker run --rm --cap-drop ALL --security-opt no-new-privileges:true malo-frontend:ci caddy version
          docker run -d --name frontend-smoke --cap-drop ALL --security-opt no-new-privileges:true -p 127.0.0.1:8080:8080 malo-frontend:ci
          trap 'docker logs frontend-smoke; docker rm -f frontend-smoke' EXIT
          for attempt in $(seq 1 20); do
            if [ "$(curl -fsS http://127.0.0.1:8080/healthz 2>/dev/null)" = ok ]; then
              curl -fsS http://127.0.0.1:8080/ | grep -q '_expo/'
              exit 0
            fi
            sleep 1
          done
          exit 1

  release:
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: production-release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Package tested source
        run: |
          git archive --format=tar HEAD > source.tar
          python3 - <<'PY'
          import json, os, tarfile, io
          metadata = json.dumps({'repository': os.environ['GITHUB_REPOSITORY'], 'sha': os.environ['GITHUB_SHA'], 'ref': os.environ['GITHUB_REF']}).encode()
          with tarfile.open('source.tar', 'a') as archive:
              info = tarfile.TarInfo('deployment.json')
              info.size = len(metadata)
              archive.addfile(info, io.BytesIO(metadata))
          PY
          gzip source.tar
      - name: Publish verified main release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(gh api repos/${GITHUB_REPOSITORY}/git/ref/heads/main --jq .object.sha)
          if [ "$current" != "$GITHUB_SHA" ]; then
            echo Superseded main commit; exit 0
          fi
          tag="deploy-${GITHUB_SHA}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; leaving its asset immutable."
          else
            gh release create "$tag" source.tar.gz --target "$GITHUB_SHA" --title "Deploy ${GITHUB_SHA:0:12}" --notes "Verified main build. VM deployment agent applies this release and checks service health." --latest
          fi
